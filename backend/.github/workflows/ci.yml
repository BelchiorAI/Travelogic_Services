name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start SQL Server with Testcontainers; Docker is preinstalled on Ubuntu runners.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file src/api/Suppliers.Api/Dockerfile --tag suppliers-api:ci .
