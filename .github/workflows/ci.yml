name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start SQL Server and an S3 gateway with Testcontainers; Docker is preinstalled on Ubuntu runners.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Build API image
        run: docker build --file src/api/Suppliers.Api/Dockerfile --tag suppliers-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      # The formatting rule is off until the code inherited from Lovable is run through Prettier once.
      - name: Lint
        run: bunx eslint . --rule "prettier/prettier: off"
